# Cấu hình DEV ONLY — cho phép kết nối ẩn danh, không TLS.
# Bắt buộc siết lại (user/pass hoặc cert) trước khi coi đây là "triển khai thật"
# theo yêu cầu bảo mật của đề bài (Chương 5 báo cáo).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
