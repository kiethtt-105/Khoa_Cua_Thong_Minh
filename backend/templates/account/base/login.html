<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Khoa Của Thông Minh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #0b5ed7); }
        .card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .logo { font-size: 2.5rem; font-weight: 700; color: #fff; }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="card p-5" style="max-width: 420px; width: 100%;">
            <div class="text-center mb-4">
                <h1 class="logo">Khoa Của Thông Minh</h1>
                <p class="text-white-50">Đăng nhập để tiếp tục</p>
            </div>

            <form id="loginForm" method="POST" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control form-control-lg" placeholder="Nhập email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Đăng nhập</button>

                <div class="d-flex justify-content-between small">
                    <a href="#" class="text-white text-decoration-none">Quên mật khẩu?</a>
                    <a href="register.html" class="text-white text-decoration-none">Đăng ký</a>
                </div>
            </form>

            <div class="text-center mt-4">
                <a href="#" class="text-white text-decoration-none">Quên mật khẩu?</a>
                <span class="text-white-50 mx-2">•</span>
                <a href="register.html" class="text-white text-decoration-none">Chưa có tài khoản?</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Vui lòng nhập đầy đủ email và mật khẩu');
                return;
            }
            
            // Trong thực tế sẽ gọi API backend
            alert('Đăng nhập thành công! (Demo)');
            window.location.href = 'dashboard.html';   // sẽ thay bằng home.html sau
        }
    </script>
</body>
</html>
