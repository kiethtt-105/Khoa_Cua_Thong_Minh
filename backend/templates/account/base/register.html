<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - Khoa Của Thông Minh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #0b5ed7); }
        .card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="card p-5" style="max-width: 420px; width: 100%;">
            <div class="text-center mb-4">
                <h1 class="logo">Khoa Của Thông Minh</h1>
                <p class="text-white-50">Tạo tài khoản mới</p>
            </div>

            <form id="registerForm" method="POST" onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" id="full_name" class="form-control form-control-lg" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control form-control-lg" placeholder="email@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control form-control-lg" placeholder="nguyenvana" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="Tạo mật khẩu" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="password2" class="form-control form-control-lg" placeholder="Xác nhận mật khẩu" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Đăng ký ngay</button>

                <div class="text-center">
                    <a href="login.html" class="text-white text-decoration-none">Đã có tài khoản? Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const pass2 = document.getElementById('password2').value;

            if (pass !== pass2) {
                alert('Mật khẩu không khớp!');
                return;
            }

            alert(`Chào mừng ${fullName}! (Demo)`);
            window.location.href = 'verify_email.html';
        }
    </script>
</body>
</html>
